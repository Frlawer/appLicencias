<script>
  function cargarAgentesJornada() {
    document.getElementById('loading').classList.remove('hidden');

    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('loading').classList.add('hidden');

        if (result.success) {
          agentesJornadaData = result.agentes;
          mostrarPanelJornada(result.agentes);
          mostrarToast('success', 'Agentes cargados', `Se cargaron ${result.agentes.length} agentes correctamente`);
        } else {
          mostrarToast('error', 'Error', result.error || 'Error al cargar agentes');
        }
      })
      .withFailureHandler(function(error) {
        document.getElementById('loading').classList.add('hidden');
        mostrarToast('error', 'Error', 'Error al cargar agentes: ' + error.message);
      })
      .obtenerAgentesJornada();
  }

  function mostrarPanelJornada(agentes) {
    const panel = document.getElementById('panel-jornada');
    const lista = document.getElementById('lista-agentes-jornada');

    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fecha-jornada').value = hoy;

    lista.innerHTML = '';

    if (agentes.length === 0) {
      lista.innerHTML = '<p class="text-gray-500 text-center py-4">No se encontraron agentes</p>';
      panel.classList.remove('hidden');
      return;
    }

    agentes.forEach((agente, index) => {
      const div = document.createElement('div');
      div.className = 'flex items-center gap-3 p-2 hover:bg-white rounded transition-colors';
      div.innerHTML = `
        <input type="checkbox" id="agente-${index}" value="${agente.numeroEmpleado}" checked
          class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
        <label for="agente-${index}" class="flex-1 text-sm cursor-pointer">
          <span class="font-medium">${agente.nombre}</span>
          <span class="text-gray-500 ml-2">(N° ${agente.numeroEmpleado})</span>
        </label>
      `;
      lista.appendChild(div);
    });

    todosSeleccionados = true;
    panel.classList.remove('hidden');
  }

  function toggleTodosAgentes() {
    todosSeleccionados = !todosSeleccionados;
    const checkboxes = document.querySelectorAll('#lista-agentes-jornada input[type="checkbox"]');
    checkboxes.forEach(cb => cb.checked = todosSeleccionados);
  }

  function generarSolicitudesJornadaMasivo() {
    const fecha = document.getElementById('fecha-jornada').value;

    if (!fecha) {
      mostrarToast('warning', 'Falta fecha', 'Por favor seleccione una fecha');
      return;
    }

    const checkboxes = document.querySelectorAll('#lista-agentes-jornada input[type="checkbox"]:checked');
    const agentesSeleccionados = Array.from(checkboxes).map(cb => cb.value);

    if (agentesSeleccionados.length === 0) {
      mostrarToast('warning', 'Sin agentes', 'Debe seleccionar al menos un agente');
      return;
    }

    if (!confirm(`¿Generar ${agentesSeleccionados.length} solicitudes de Jornada Institucional para el ${fecha}?`)) {
      return;
    }

    document.getElementById('loading').classList.remove('hidden');

    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('loading').classList.add('hidden');

        if (result.success) {
          let mensaje = `✓ Solicitudes generadas: ${result.exitosas}`;
          if (result.fallidas > 0) {
            mensaje += `\n✕ Fallidas: ${result.fallidas}`;
            if (result.errores && result.errores.length > 0) {
              console.log('Errores:', result.errores);
            }
          }
          mostrarToast('success', 'Solicitudes generadas', mensaje, 7000);
          cancelarJornada();
          cambiarVista('solicitudes');
        } else {
          mostrarToast('error', 'Error', result.error || 'Error al generar solicitudes');
        }
      })
      .withFailureHandler(function(error) {
        document.getElementById('loading').classList.add('hidden');
        mostrarToast('error', 'Error', 'Error al generar: ' + error.message);
      })
      .generarSolicitudesJornada(fecha, agentesSeleccionados);
  }

  function cancelarJornada() {
    document.getElementById('panel-jornada').classList.add('hidden');
    document.getElementById('lista-agentes-jornada').innerHTML = '';
    agentesJornadaData = [];
    todosSeleccionados = false;
  }

  function mostrarEmails() {
    const checkboxes = document.querySelectorAll('#lista-agentes-jornada input[type="checkbox"]:checked');
    const emailsSeleccionados = [];

    checkboxes.forEach(cb => {
      const numEmpleado = cb.value;
      const agente = agentesJornadaData.find(a => a.numeroEmpleado === numEmpleado);
      if (agente) {
        emailsSeleccionados.push({
          nombre: agente.nombre,
          numeroEmpleado: agente.numeroEmpleado,
          email: null
        });
      }
    });

    if (emailsSeleccionados.length === 0) {
      mostrarToast('warning', 'Sin agentes', 'Debe seleccionar al menos un agente');
      return;
    }

    document.getElementById('loading').classList.remove('hidden');

    const numerosEmpleado = emailsSeleccionados.map(a => a.numeroEmpleado);

    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('loading').classList.add('hidden');

        if (result.success) {
          const emailsList = result.emails.join(',');
          document.getElementById('emails-box').textContent = emailsList;
          document.getElementById('modal-emails-jornada').classList.remove('hidden');
        } else {
          mostrarToast('error', 'Error', result.error || 'Error al obtener emails');
        }
      })
      .withFailureHandler(function(error) {
        document.getElementById('loading').classList.add('hidden');
        mostrarToast('error', 'Error', 'Error al obtener emails: ' + error.message);
      })
      .obtenerEmailsAgentes(numerosEmpleado);
  }

  function copiarEmails() {
    const emailsBox = document.getElementById('emails-box');
    const texto = emailsBox.textContent;

    navigator.clipboard.writeText(texto).then(function() {
      mostrarToast('success', 'Copiado', `${texto.split('\n').length} emails copiados al portapapeles`);
    }).catch(function(error) {
      console.error('Error al copiar:', error);
      mostrarToast('error', 'Error', 'No se pudo copiar al portapapeles');
    });
  }

  function cerrarModalEmails() {
    document.getElementById('modal-emails-jornada').classList.add('hidden');
  }
</script>
