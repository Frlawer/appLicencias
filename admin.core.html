<script>
  // ========== VARIABLES GLOBALES PRINCIPALES ==========
  let solicitudesData = [];
  let justificacionesData = [];
  let descuentosInjustificadosData = [];
  let registroEditando = null;
  let emailData = null;
  let agentesJornadaData = [];
  let todosSeleccionados = false;

  // ========== VARIABLES DE PAGINACIÓN ==========
  let paginaActualSolicitudes = 1;
  let paginaActualJustificaciones = 1;
  let paginaActualDescuentos = 1;
  let registrosPorPagina = 25;

  // ========== VARIABLES DE BÚSQUEDA Y FILTROS ==========
  let solicitudesFiltradas = [];
  let justificacionesFiltradas = [];
  let filtroActivoSolicitudes = false;
  let filtroActivoJustificaciones = false;

  // ========== VARIABLES DE CACHÉ ==========
  const CACHE_DURATION = 5 * 60 * 1000; // 5 minutos en milisegundos
  let ultimaCargarSolicitudes = 0;
  let ultimaCargarJustificaciones = 0;

  // Toast helpers
  function mostrarToast(tipo, titulo, texto, duracion = 5000) {
    const toast = document.getElementById('toast-message-cta');
    const icono = document.getElementById('iconoNotificacion');
    const tituloElement = document.getElementById('tituloNotificacion');
    const textoElement = document.getElementById('textoNotificacion');
    
    let iconoHTML = '';
    let claseColor = '';
    let fondoColor = '';
    
    switch(tipo) {
      case 'success':
        iconoHTML = '✓';
        claseColor = 'text-green-600';
        fondoColor = 'bg-green-300';
        break;
      case 'error':
        iconoHTML = '✕';
        claseColor = 'text-red-600';
        fondoColor = 'bg-red-300';
        break;
      case 'warning':
        iconoHTML = '⚠';
        claseColor = 'text-yellow-600';
        fondoColor = 'bg-yellow-300';
        break;
      case 'info':
        iconoHTML = 'ℹ';
        claseColor = 'text-blue-600';
        fondoColor = 'bg-blue-300';
        break;
      default:
        iconoHTML = '•';
        claseColor = 'text-gray-600';
        fondoColor = 'bg-gray-300';
    }
    
    icono.innerHTML = iconoHTML;
    icono.className = `text-2xl font-bold ${claseColor}`;
    tituloElement.textContent = titulo;
    textoElement.textContent = texto;
    
    toast.classList.remove('hidden');
    toast.classList.add('animate-slide-in', fondoColor);
    
    if (duracion > 0) {
      setTimeout(() => {
        ocultarToast(fondoColor);
      }, duracion);
    }
  }

  function ocultarToast(fondoColor) {
    const toast = document.getElementById('toast-message-cta');
    toast.classList.add('animate-slide-out');
    setTimeout(() => {
      toast.classList.add('hidden');
      toast.classList.remove('animate-slide-in', 'animate-slide-out', fondoColor);
    }, 300);
  }

  // Stub functions (serán reemplazadas por los parciales)
  // Estos son placeholders que se ejecutan si se llaman antes de que se carguen los parciales
  window._parcialesReady = false;

  document.addEventListener('DOMContentLoaded', function() {
    const closeButton = document.querySelector('[data-dismiss-target="#toast-message-cta"]');
    if (closeButton) {
      closeButton.addEventListener('click', () => ocultarToast(''));
    }
    
    // Esperar a que todos los parciales se carguen (5000ms = 5 segundos)
    // Da tiempo suficiente a que los navegadores ejecuten todos los scripts
    setTimeout(function() {
      window._parcialesReady = true;
      
      // Inicializar con validaciones
      if (typeof cambiarVista === 'function') {
        cambiarVista('solicitudes');
      }
      
      // Cargar novedades después de un pequeño delay
      setTimeout(function() {
        if (typeof cargarNovedadesSemana === 'function') {
          cargarNovedadesSemana();
        }
      }, 500);
    }, 5000);
  });

  // Cambiar entre vistas
  function cambiarVista(vista) {
    document.querySelectorAll('.sidebar-link').forEach(link => link.classList.remove('active'));
    document.getElementById('vista-solicitudes').classList.add('hidden');
    document.getElementById('vista-justificaciones').classList.add('hidden');
    document.getElementById('vista-descuentos').classList.add('hidden');
    document.getElementById('vista-jornada').classList.add('hidden');
    document.getElementById('vista-siso').classList.add('hidden');
    document.getElementById('vista-agregar').classList.add('hidden');

    if (vista === 'solicitudes') {
      document.getElementById('menu-solicitudes').classList.add('active');
      document.getElementById('titulo-seccion').textContent = 'Solicitudes de Licencia';
      document.getElementById('subtitulo-seccion').textContent = 'Gestione las solicitudes pendientes';
      document.getElementById('vista-solicitudes').classList.remove('hidden');
      cargarSolicitudes();
    } else if (vista === 'justificaciones') {
      document.getElementById('menu-justificaciones').classList.add('active');
      document.getElementById('titulo-seccion').textContent = 'Justificaciones Cargadas';
      document.getElementById('subtitulo-seccion').textContent = 'Revise los archivos justificatorios';
      document.getElementById('vista-justificaciones').classList.remove('hidden');
      cargarJustificaciones();
    } else if (vista === 'descuentos') {
      document.getElementById('menu-descuentos').classList.add('active');
      document.getElementById('titulo-seccion').textContent = 'Descuentos/Injustificados';
      document.getElementById('subtitulo-seccion').textContent = 'Solicitudes con descuento sin justificación válida';
      document.getElementById('vista-descuentos').classList.remove('hidden');
      cargarDescuentosInjustificados();
    } else if (vista === 'jornada') {
      document.getElementById('menu-jornada').classList.add('active');
      document.getElementById('titulo-seccion').textContent = 'Registros de Jornada';
      document.getElementById('subtitulo-seccion').textContent = 'Revise los registros de jornada cargados';
      document.getElementById('vista-jornada').classList.remove('hidden');
    } else if (vista === 'siso') {
      document.getElementById('menu-siso').classList.add('active');
      document.getElementById('titulo-seccion').textContent = 'Cargar Datos SISO';
      document.getElementById('subtitulo-seccion').textContent = 'Importar datos desde archivo CSV';
      document.getElementById('vista-siso').classList.remove('hidden');
    } else if (vista === 'agregar') {
      document.getElementById('menu-agregar').classList.add('active');
      document.getElementById('titulo-seccion').textContent = 'Agregar Solicitud Manual';
      document.getElementById('subtitulo-seccion').textContent = 'Cargue una nueva solicitud manualmente';
      document.getElementById('vista-agregar').classList.remove('hidden');
    }
  }

  // Recargar datos
  function recargarDatos() {
    limpiarTodoCache();
    const vistaActual = obtenerVistaActual();
    cambiarVista(vistaActual);
  }

  function obtenerVistaActual() {
    const vistas = ['solicitudes', 'justificaciones', 'descuentos', 'jornada', 'siso', 'agregar'];
    for (const vista of vistas) {
      const el = document.getElementById(`vista-${vista}`);
      if (el && !el.classList.contains('hidden')) return vista;
    }
    return 'solicitudes';
  }

  // Cargar solicitudes
  function cargarSolicitudes() {
    document.getElementById('loading').classList.remove('hidden');
    paginaActualSolicitudes = 1;

    const datosEnCache = obtenerCacheSolicitudes();
    if (datosEnCache) {
      solicitudesData = datosEnCache;
      solicitudesFiltradas = [...solicitudesData];
      filtroActivoSolicitudes = false;
      limpiarInputsFiltroSolicitudes();
      document.getElementById('loading').classList.add('hidden');
      renderizarSolicitudesPaginadas();
      mostrarToast('info', 'Caché', 'Datos cargados desde caché local (5 min)');
      return;
    }

    google.script.run
      .withSuccessHandler(function (data) {
        document.getElementById('loading').classList.add('hidden');
        
        if (!data || !Array.isArray(data)) {
          console.error('[ERROR] Datos inválidos recibidos:', data);
          solicitudesData = [];
          solicitudesFiltradas = [];
          renderizarSolicitudesPaginadas();
          return;
        }

        solicitudesData = data.reverse();
        solicitudesFiltradas = [...solicitudesData];
        filtroActivoSolicitudes = false;
        limpiarInputsFiltroSolicitudes();
        
        guardarCacheSolicitudes(solicitudesData);
        
        renderizarSolicitudesPaginadas();
        mostrarToast('success', 'Datos', `${solicitudesData.length} solicitudes cargadas`);
      })
      .withFailureHandler(function (error) {
        document.getElementById('loading').classList.add('hidden');
        console.error('[ERROR] Error al cargar solicitudes:', error);
        mostrarToast('error', 'Error', 'Error al cargar solicitudes: ' + error.message);
      })
      .obtenerTodasSolicitudes();
  }

  // Renderizar solicitudes
  function renderizarSolicitudes(solicitudes) {
    const tbody = document.getElementById('tabla-solicitudes');
    tbody.innerHTML = '';

    if (!solicitudes || !Array.isArray(solicitudes)) {
      tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-4 text-center text-gray-500">No hay datos para mostrar</td></tr>';
      return;
    }

    if (solicitudes.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-4 text-center text-gray-500">No hay solicitudes registradas</td></tr>';
      return;
    }

    solicitudes.forEach(sol => {
      const tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50';

      const estadoColor = obtenerClaseEstado(sol.estado);

      tr.innerHTML = `
        <td class="px-3 py-3 text-sm text-gray-900">${formatearFecha(sol.timestamp)}</td>
        <td class="px-3 py-3 text-sm font-medium text-gray-900">${sol.apellidos.toUpperCase()}, ${sol.nombres.toUpperCase()}</td>
        <td class="px-3 py-3 text-sm text-gray-500">${sol.dni}</td>
        <td class="px-3 py-3 text-sm text-gray-900">${sol.numeroEmpleado}</td>
        <td class="px-3 py-3 text-sm text-gray-500">${formatearFechaCorta(sol.fechaDesde)} - ${formatearFechaCorta(sol.fechaHasta)}</td>
        <td class="px-3 py-3 text-xs text-gray-500">${sol.cursoOCargo || '-'}</td>
        <td class="px-3 py-3 text-sm text-gray-900">${sol.articulacion}</td>
        <td class="px-3 py-3 text-sm text-gray-900">${sol.tipoLicencia}</td>
        <td class="px-3 py-3 whitespace-nowrap">
          <span class="px-2 py-1 text-xs font-semibold rounded-full ${estadoColor}">${sol.estado}</span>
        </td>
        <td class="px-3 py-3 text-sm">
          <button onclick="abrirModalEstado(${sol.rowIndex}, 'solicitud')" 
            class="text-blue-600 hover:text-blue-800 mr-3 whitespace-nowrap min-w-6">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M11 4H7.2C6.0799 4 5.51984 4 5.09202 4.21799C4.71569 4.40974 4.40973 4.7157 4.21799 5.09202C4 5.51985 4 6.0799 4 7.2V16.8C4 17.9201 4 18.4802 4.21799 18.908C4.40973 19.2843 4.71569 19.5903 5.09202 19.782C5.51984 20 6.0799 20 7.2 20H16.8C17.9201 20 18.4802 20 18.908 19.782C19.2843 19.5903 19.5903 19.2843 19.782 18.908C20 18.4802 20 17.9201 20 16.8V12.5M15.5 5.5L18.3284 8.32843M10.7627 10.2373L17.411 3.58902C18.192 2.80797 19.4584 2.80797 20.2394 3.58902C21.0205 4.37007 21.0205 5.6364 20.2394 6.41745L13.3774 13.2794C12.6158 14.0411 12.235 14.4219 11.8012 14.7247C11.4162 14.9936 11.0009 15.2162 10.564 15.3882C10.0717 15.582 9.54378 15.6885 8.48793 15.9016L8 16L8.04745 15.6678C8.21536 14.4925 8.29932 13.9048 8.49029 13.3561C8.65975 12.8692 8.89125 12.4063 9.17906 11.9786C9.50341 11.4966 9.92319 11.0768 10.7627 10.2373Z" stroke="#2B3E4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg></button>
          <button onclick="abrirModalEmail('${sol.email}', '${sol.apellidos.toUpperCase()}, ${sol.nombres.toUpperCase()}')" 
            class="text-green-600 hover:text-green-800 whitespace-nowrap min-w-6">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M3 8L8.44992 11.6333C9.73295 12.4886 10.3745 12.9163 11.0678 13.0825C11.6806 13.2293 12.3194 13.2293 12.9322 13.0825C13.6255 12.9163 14.2671 12.4886 15.5501 11.6333L21 8M6.2 19H17.8C18.9201 19 19.4802 19 19.908 18.782C20.2843 18.5903 20.5903 18.2843 20.782 17.908C21 17.4802 21 16.9201 21 15.8V8.2C21 7.0799 21 6.51984 20.782 6.09202C20.5903 5.71569 20.2843 5.40973 19.908 5.21799C19.4802 5 18.9201 5 17.8 5H6.2C5.0799 5 4.51984 5 4.09202 5.21799C3.71569 5.40973 3.40973 5.71569 3.21799 6.09202C3 6.51984 3 7.07989 3 8.2V15.8C3 16.9201 3 17.4802 3.21799 17.908C3.40973 18.2843 3.71569 18.5903 4.09202 18.782C4.51984 19 5.07989 19 6.2 19Z" stroke="#2B3E4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg></button>
          <div class="mt-1">
            <button onclick="eliminarSolicitud(${sol.rowIndex}, '${sol.apellidos.toUpperCase()}, ${sol.nombres.toUpperCase()}')" 
              class="text-red-600 hover:text-red-800 whitespace-nowrap min-w-6">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6M18 6V16.2C18 17.8802 18 18.7202 17.673 19.362C17.3854 19.9265 16.9265 20.3854 16.362 20.673C15.7202 21 14.8802 21 13.2 21H10.8C9.11984 21 8.27976 21 7.63803 20.673C7.07354 20.3854 6.6146 19.9265 6.32698 19.362C6 18.7202 6 17.8802 6 16.2V6M14 10V17M10 10V17" stroke="#2B3E4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg></button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function obtenerClaseEstado(estado) {
    const normalizado = String(estado || '').trim().toLowerCase();

    switch (normalizado) {
      case 'pendiente':
        return 'bg-yellow-100 text-yellow-800';
      case 'autorizado':
      case 'autorizada':
        return 'bg-green-100 text-green-800';
      case 'completado':
      case 'completada':
        return 'bg-slate-100 text-slate-800';
      case 'justificada':
        return 'bg-blue-100 text-blue-800';
      case 'injustificada':
        return 'bg-red-100 text-red-800';
      case 'descuento':
        return 'bg-orange-100 text-orange-800';
      case 'rechazado':
      case 'rechazada':
        return 'bg-rose-100 text-rose-800';
      default:
        return 'bg-gray-100 text-gray-800';
    }
  }

  // Cargar justificaciones
  function cargarJustificaciones() {
    document.getElementById('loading').classList.remove('hidden');
    paginaActualJustificaciones = 1;

    const datosEnCache = obtenerCacheJustificaciones();
    if (datosEnCache) {
      justificacionesData = datosEnCache;
      justificacionesFiltradas = [...justificacionesData];
      filtroActivoJustificaciones = false;
      limpiarInputsFiltroJustificaciones();
      document.getElementById('loading').classList.add('hidden');
      renderizarJustificacionesPaginadas();
      mostrarToast('info', 'Caché', 'Datos cargados desde caché local (5 min)');
      return;
    }
    
    google.script.run
      .withSuccessHandler(function (data) {
        document.getElementById('loading').classList.add('hidden');

        if (!data || !Array.isArray(data)) {
          console.error('Datos inválidos recibidos:', data);
          justificacionesData = [];
          justificacionesFiltradas = [];
          renderizarJustificacionesPaginadas();
          return;
        }

        justificacionesData = data.reverse();
        justificacionesFiltradas = [...justificacionesData];
        filtroActivoJustificaciones = false;
        limpiarInputsFiltroJustificaciones();
        
        guardarCacheJustificaciones(justificacionesData);
        
        renderizarJustificacionesPaginadas();
        mostrarToast('success', 'Datos', `${justificacionesData.length} justificaciones cargadas`);
      })
      .withFailureHandler(function (error) {
        document.getElementById('loading').classList.add('hidden');
        console.error('Error al cargar:', error);
        mostrarToast('error', 'Error', 'Error al cargar justificaciones: ' + error.message);
      })
      .obtenerTodasJustificaciones();
  }

  // Renderizar justificaciones
  function renderizarJustificaciones(justificaciones) {
    const tbody = document.getElementById('tabla-justificaciones');
    tbody.innerHTML = '';

    if (!justificaciones || !Array.isArray(justificaciones)) {
      tbody.innerHTML = '<tr><td colspan="7" class="px-3 py-3 text-center text-gray-500">No hay datos para mostrar</td></tr>';
      return;
    }

    if (justificaciones.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">No hay justificaciones registradas</td></tr>';
      return;
    }

    function renderArchivos(archivoUrl) {
      if (!archivoUrl) return '-';
      const urls = archivoUrl.split(',').map(u => u.trim()).filter(Boolean);
      if (!urls.length) return '-';
      return urls.map((u, idx) => `
        <a href="${u}" target="_blank" class="flex items-center gap-1 text-blue-600 hover:text-blue-800">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" class="w-4 h-4"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M9 17H13M9 13H13M9 9H10M17 18V21M17 15H17.01M13 3H8.2C7.0799 3 6.51984 3 6.09202 3.21799C5.71569 3.40973 5.40973 3.71569 5.21799 4.09202C5 4.51984 5 5.0799 5 6.2V17.8C5 18.9201 5 19.4802 5.21799 19.908C5.40973 20.2843 5.71569 20.5903 6.09202 20.782C6.51984 21 7.0799 21 8.2 21H13M13 3L19 9M13 3V7.4C13 7.96005 13 8.24008 13.109 8.45399C13.2049 8.64215 13.3578 8.79513 13.546 8.89101C13.7599 9 14.0399 9 14.6 9H19M19 9V11.5" stroke="#2b3e4c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
           ${idx + 1}
        </a>`).join('<br>');
    }

    function renderIds(idsString) {
      if (!idsString) return '-';
      const ids = idsString.split(',').map(i => i.trim()).filter(Boolean);
      if (!ids.length) return '-';
      return ids.map(id => `
        <button class="text-blue-600 hover:text-blue-800 underline" onclick="verSolicitudPorId('${id}')">
          ${id}
        </button>
      `).join('<br>');
    }

    justificaciones.forEach(just => {
      const tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50';

      tr.innerHTML = `
        <td class="px-3 py-4 whitespace-nowrap text-sm text-gray-900">${formatearFecha(just.timestamp)}</td>
        <td class="px-3 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${just.apellidos.toUpperCase()}, ${just.nombres.toUpperCase()}</td>
        <td class="px-3 py-4 whitespace-nowrap text-sm text-gray-500">${just.dni}</td>
        <td class="px-3 py-4 text-sm text-gray-500">${renderIds(just.idsSolicitudes)}</td>
        <td class="px-3 py-4 whitespace-nowrap text-sm text-gray-500">${just.cantidadLicencias}</td>
        <td class="px-3 py-4 whitespace-nowrap text-sm">
          ${renderArchivos(just.archivoUrl)}
        </td>
        <td class="px-3 py-4 whitespace-nowrap text-sm space-x-2">
          <button onclick="abrirModalEmail('${just.email}', '${just.apellidos.toUpperCase()}, ${just.nombres.toUpperCase()}')" 
            class="text-green-600 hover:text-green-800 inline-flex items-center gap-1">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" stroke="currentColor" stroke-width="2"><path d="M3 8L8.44992 11.6333C9.73295 12.4886 10.3745 12.9163 11.0678 13.0825C11.6806 13.2293 12.3194 13.2293 12.9322 13.0825C13.6255 12.9163 14.2671 12.4886 15.5501 11.6333L21 8M6.2 19H17.8C18.9201 19 19.4802 19 19.908 18.782C20.2843 18.5903 20.5903 18.2843 20.782 17.908C21 17.4802 21 16.9201 21 15.8V8.2C21 7.0799 21 6.51984 20.782 6.09202C20.5903 5.71569 20.2843 5.40973 19.908 5.21799C19.4802 5 18.9201 5 17.8 5H6.2C5.0799 5 4.51984 5 4.09202 5.21799C3.71569 5.40973 3.40973 5.71569 3.21799 6.09202C3 6.51984 3 7.07989 3 8.2V15.8C3 16.9201 3 17.4802 3.21799 17.908C3.40973 18.2843 3.71569 18.5903 4.09202 18.782C4.51984 19 5.07989 19 6.2 19Z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span></span>
          </button>
          <button onclick="eliminarJustificacion(${just.rowIndex}, '${just.apellidos.toUpperCase()}, ${just.nombres.toUpperCase()}')"
            class="text-red-600 hover:text-red-800 inline-flex items-center gap-1 min-w-6">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" stroke="currentColor" stroke-width="2"><path d="M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6M18 6V16.2C18 17.8802 18 18.7202 17.673 19.362C17.3854 19.9265 16.9265 20.3854 16.362 20.673C15.7202 21 14.8802 21 13.2 21H10.8C9.11984 21 8.27976 21 7.63803 20.673C7.07354 20.3854 6.6146 19.9265 6.32698 19.362C6 18.7202 6 17.8802 6 16.2V6M14 10V17M10 10V17" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span></span>
          </button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Cargar descuentos/injustificados
  function cargarDescuentosInjustificados() {
    document.getElementById('loading').classList.remove('hidden');
    paginaActualDescuentos = 1;

    const cacheSol = obtenerCacheSolicitudes();
    const cacheJust = obtenerCacheJustificaciones();

    if (cacheSol && cacheJust) {
      solicitudesData = cacheSol;
      justificacionesData = cacheJust;
      document.getElementById('loading').classList.add('hidden');
      actualizarDescuentosInjustificados();
      mostrarToast('info', 'Caché', 'Datos cargados desde caché local (5 min)');
      return;
    }

    google.script.run
      .withSuccessHandler(function (dataSolicitudes) {
        solicitudesData = Array.isArray(dataSolicitudes) ? dataSolicitudes.reverse() : [];
        guardarCacheSolicitudes(solicitudesData);

        google.script.run
          .withSuccessHandler(function (dataJustificaciones) {
            justificacionesData = Array.isArray(dataJustificaciones) ? dataJustificaciones.reverse() : [];
            guardarCacheJustificaciones(justificacionesData);
            document.getElementById('loading').classList.add('hidden');
            actualizarDescuentosInjustificados();
            mostrarToast('success', 'Datos', `${descuentosInjustificadosData.length} solicitudes encontradas`);
          })
          .withFailureHandler(function (error) {
            document.getElementById('loading').classList.add('hidden');
            mostrarToast('error', 'Error', 'Error al cargar justificaciones: ' + error.message);
          })
          .obtenerTodasJustificaciones();
      })
      .withFailureHandler(function (error) {
        document.getElementById('loading').classList.add('hidden');
        mostrarToast('error', 'Error', 'Error al cargar solicitudes: ' + error.message);
      })
      .obtenerTodasSolicitudes();
  }

  function actualizarDescuentosInjustificados() {
    descuentosInjustificadosData = filtrarDescuentosInjustificados(solicitudesData, justificacionesData);
    renderizarDescuentosInjustificadosPaginadas();
  }

  function filtrarDescuentosInjustificados(solicitudes, justificaciones) {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const idsJustificados = obtenerIdsJustificados(justificaciones || []);

    return (solicitudes || []).filter(sol => {
      const estadoNorm = normalizarTexto(sol.estado);
      const estadoOk =
        estadoNorm === 'injustificado' ||
        estadoNorm === 'injustificada' ||
        estadoNorm === 'autorizado' ||
        estadoNorm === 'autorizada';

      const fechaHasta = parseFechaLocal(sol.fechaHasta);
      if (!fechaHasta) return false;
      fechaHasta.setHours(0, 0, 0, 0);
      const diffDias = (hoy - fechaHasta) / (1000 * 60 * 60 * 24);
      const fechaOk = diffDias > 3;

      const idSolicitud = String(sol.id || '').trim();
      const noEstaJustificada = !idSolicitud || !idsJustificados.has(idSolicitud);

      return estadoOk && fechaOk && noEstaJustificada;
    });
  }

  function obtenerIdsJustificados(justificaciones) {
    const ids = new Set();
    justificaciones.forEach(just => {
      const raw = String(just.idsSolicitudes || '');
      raw.split(',').map(s => s.trim()).filter(Boolean).forEach(id => ids.add(id));
    });
    return ids;
  }

  function normalizarTexto(valor) {
    return String(valor || '').trim().toLowerCase();
  }

  // Renderizar descuentos/injustificados
  function renderizarDescuentosInjustificados(solicitudes) {
    const tbody = document.getElementById('tabla-descuentos');
    tbody.innerHTML = '';

    if (!solicitudes || !Array.isArray(solicitudes)) {
      tbody.innerHTML = '<tr><td colspan="11" class="px-6 py-4 text-center text-gray-500">No hay datos para mostrar</td></tr>';
      return;
    }

    if (solicitudes.length === 0) {
      tbody.innerHTML = '<tr><td colspan="11" class="px-6 py-4 text-center text-gray-500">No hay solicitudes para mostrar</td></tr>';
      return;
    }

      const tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50';

      tr.innerHTML = `

        <td class="px-3 py-3 text-sm font-medium text-gray-900">${sol.apellidos.toUpperCase()}, ${sol.nombres.toUpperCase()}</td>
        <td class="px-3 py-3 text-sm text-gray-500">${sol.dni}</td>
        <td class="px-3 py-3 text-sm text-gray-900">${sol.numeroEmpleado}</td>
        <td class="px-3 py-3 text-sm text-gray-500">${formatearFechaCorta(sol.fechaDesde)} - ${formatearFechaCorta(sol.fechaHasta)}</td>
        <td class="px-3 py-3 text-xs text-gray-500">${sol.cursoOCargo || '-'}</td>
        <td class="px-3 py-3 text-sm text-gray-900">${sol.articulacion}</td>
        <td class="px-3 py-3 text-sm text-gray-900">${sol.tipoLicencia}</td>
        <td class="px-3 py-3 whitespace-nowrap">
          <span class="px-2 py-1 text-xs font-semibold rounded-full ${estadoColor}">${sol.estado}</span>
        </td>
        <td class="px-3 py-3 text-xs text-gray-600">${sol.id || '-'}</td>
        <td class="px-3 py-3 text-sm">
          <button onclick="abrirModalEstado(${sol.rowIndex}, 'solicitud')" 
            class="text-blue-600 hover:text-blue-800 mr-3 whitespace-nowrap min-w-6">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M11 4H7.2C6.0799 4 5.51984 4 5.09202 4.21799C4.71569 4.40974 4.40973 4.7157 4.21799 5.09202C4 5.51985 4 6.0799 4 7.2V16.8C4 17.9201 4 18.4802 4.21799 18.908C4.40973 19.2843 4.71569 19.5903 5.09202 19.782C5.51984 20 6.0799 20 7.2 20H16.8C17.9201 20 18.4802 20 18.908 19.782C19.2843 19.5903 19.5903 19.2843 19.782 18.908C20 18.4802 20 17.9201 20 16.8V12.5M15.5 5.5L18.3284 8.32843M10.7627 10.2373L17.411 3.58902C18.192 2.80797 19.4584 2.80797 20.2394 3.58902C21.0205 4.37007 21.0205 5.6364 20.2394 6.41745L13.3774 13.2794C12.6158 14.0411 12.235 14.4219 11.8012 14.7247C11.4162 14.9936 11.0009 15.2162 10.564 15.3882C10.0717 15.582 9.54378 15.6885 8.48793 15.9016L8 16L8.04745 15.6678C8.21536 14.4925 8.29932 13.9048 8.49029 13.3561C8.65975 12.8692 8.89125 12.4063 9.17906 11.9786C9.50341 11.4966 9.92319 11.0768 10.7627 10.2373Z" stroke="#2B3E4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg></button>
          <button onclick="abrirModalEmail('${sol.email}', '${sol.apellidos.toUpperCase()}, ${sol.nombres.toUpperCase()}')" 
            class="text-green-600 hover:text-green-800 whitespace-nowrap min-w-6">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M3 8L8.44992 11.6333C9.73295 12.4886 10.3745 12.9163 11.0678 13.0825C11.6806 13.2293 12.3194 13.2293 12.9322 13.0825C13.6255 12.9163 14.2671 12.4886 15.5501 11.6333L21 8M6.2 19H17.8C18.9201 19 19.4802 19 19.908 18.782C20.2843 18.5903 20.5903 18.2843 20.782 17.908C21 17.4802 21 16.9201 21 15.8V8.2C21 7.0799 21 6.51984 20.782 6.09202C20.5903 5.71569 20.2843 5.40973 19.908 5.21799C19.4802 5 18.9201 5 17.8 5H6.2C5.0799 5 4.51984 5 4.09202 5.21799C3.71569 5.40973 3.40973 5.71569 3.21799 6.09202C3 6.51984 3 7.07989 3 8.2V15.8C3 16.9201 3 17.4802 3.21799 17.908C3.40973 18.2843 3.71569 18.5903 4.09202 18.782C4.51984 19 5.07989 19 6.2 19Z" stroke="#2B3E4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg></button>
          <div class="mt-1">
            <button onclick="eliminarSolicitud(${sol.rowIndex}, '${sol.apellidos.toUpperCase()}, ${sol.nombres.toUpperCase()}')" 
              class="text-red-600 hover:text-red-800 whitespace-nowrap min-w-6">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6M18 6V16.2C18 17.8802 18 18.7202 17.673 19.362C17.3854 19.9265 16.9265 20.3854 16.362 20.673C15.7202 21 14.8802 21 13.2 21H10.8C9.11984 21 8.27976 21 7.63803 20.673C7.07354 20.3854 6.6146 19.9265 6.32698 19.362C6 18.7202 6 17.8802 6 16.2V6M14 10V17M10 10V17" stroke="#2B3E4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg></button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);

  }

  // Parsear fecha sin desfase (yyyy-mm-dd)
  function parseFechaLocal(fecha) {
    if (!fecha) return null;
    if (typeof fecha === 'string') {
      const match = fecha.match(/^\d{4}-\d{2}-\d{2}$/);
      if (match) {
        const [y, m, d] = fecha.split('-').map(Number);
        return new Date(y, m - 1, d);
      }
    }
    const d = new Date(fecha);
    return isNaN(d.getTime()) ? null : d;
  }

  // Formatear fecha completa
  function formatearFecha(fecha) {
    const d = parseFechaLocal(fecha);
    if (!d) return '-';
    return d.toLocaleDateString('es-AR', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  // Formatear fecha corta
  function formatearFechaCorta(fecha) {
    const d = parseFechaLocal(fecha);
    if (!d) return '-';
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
</script>
