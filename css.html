  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sistema de Licencias - CPEM N° 25</title>
  
  <!-- Google Fonts - Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <style>
    * {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    :root {
      --primary: #2B3E4C;
      --primary-light: #3d5468;
      --primary-dark: #1f2d38;
      --secondary: #10b981;
      --secondary-light: #34d399;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --text-primary: #2B3E4C;
      --text-secondary: #64748b;
      --border-light: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }
    
    body {
      background: var(--bg-light);
      color: var(--text-primary);
    }
    
    .spinner {
      border: 3px solid #f1f5f9;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes slideIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .animate-slide-in {
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideOut {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-10px); opacity: 0; }
    }
    
    .animate-slide-out {
      animation: slideOut 0.3s ease-out;
    }
    
    .card {
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: box-shadow 0.2s ease;
    }
    
    .card:hover {
      box-shadow: var(--shadow-md);
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    
    .btn-primary:hover {
      background: var(--primary-light);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    
    .btn-primary:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }

    .section-toggle {
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.25s ease;
      border: 2px solid transparent;
      box-shadow: var(--shadow-sm);
      color: white;
    }

    .section-toggle .material-icons {
      transition: transform 0.2s ease;
    }

    .section-toggle:hover .material-icons {
      transform: translateY(-1px);
    }

    .section-toggle--solicitud {
      background: var(--primary-light);
    }

    .section-toggle--solicitud:hover {
      background: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .section-toggle--justificacion {
      background: var(--secondary-light);
    }

    .section-toggle--justificacion:hover {
      background: var(--secondary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .section-toggle.is-active {
      box-shadow: var(--shadow-lg);
      transform: translateY(-1px);
    }

    .section-toggle--solicitud.is-active {
      background: var(--primary);
      border-color: var(--primary-dark);
    }

    .section-toggle--justificacion.is-active {
      background: var(--secondary);
      border-color: #059669;
    }

    .section-panel {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .section-panel--solicitud {
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 20%);
      border-top: 4px solid var(--primary-light);
    }

    .section-panel--justificacion {
      background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 22%);
      border-top: 4px solid var(--secondary);
    }

    @keyframes sectionFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sectionFadeOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-6px);
      }
    }

    .section-fade-in {
      animation: sectionFadeIn 0.28s ease forwards;
    }

    .section-fade-out {
      animation: sectionFadeOut 0.2s ease forwards;
    }

    .flow-step-card {
      border: 2px solid var(--border-light);
      border-radius: 12px;
      padding: 16px;
      background: #ffffff;
    }

    .flow-step-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--primary);
    }

    .step-signal {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: 10px;
      border: 2px solid;
      padding: 10px 12px;
      transition: all 0.2s ease;
    }

    .step-signal--pending {
      color: #9a6700;
      border-color: #facc15;
      background: #fef9c3;
    }

    .step-signal--ready {
      color: #065f46;
      border-color: #34d399;
      background: #d1fae5;
    }

    #form-justificacion {
      padding-bottom: 120px;
    }

    #form-solicitud {
      padding-bottom: 120px;
    }

    #just-senal {
      position: fixed;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      width: min(92vw, 760px);
      z-index: 60;
      border-width: 2px;
      box-shadow:
        0 14px 30px rgb(15 23 42 / 0.22),
        0 4px 8px rgb(15 23 42 / 0.12);
      backdrop-filter: blur(2px);
      transition: bottom 0.25s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    #sol-senal {
      position: fixed;
      left: 50%;
      bottom: 5px;
      transform: translateX(-50%);
      width: min(92vw, 760px);
      z-index: 60;
      border-width: 2px;
      box-shadow:
        0 14px 30px rgb(15 23 42 / 0.22),
        0 4px 8px rgb(15 23 42 / 0.12);
      backdrop-filter: blur(2px);
      transition: bottom 0.25s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    #sol-senal.step-signal--pending {
      background: linear-gradient(180deg, #e2ecf5 0%, #d5e2ef 100%);
      border-color: #64748b;
      color: #1e293b;
    }

    #sol-senal.step-signal--ready {
      background: linear-gradient(180deg, #d1fae5 0%, #a7f3d0 100%);
      border-color: #10b981;
      color: #065f46;
      box-shadow:
        0 18px 30px rgb(6 95 70 / 0.25),
        0 6px 12px rgb(6 95 70 / 0.12);
    }

    #just-senal.step-signal--pending {
      background: linear-gradient(180deg, #fff8cc 0%, #fff1a8 100%);
      border-color: #eab308;
      color: #854d0e;
    }

    #just-senal.step-signal--ready {
      background: linear-gradient(180deg, #d1fae5 0%, #a7f3d0 100%);
      border-color: #10b981;
      color: #065f46;
      box-shadow:
        0 18px 30px rgb(6 95 70 / 0.25),
        0 6px 12px rgb(6 95 70 / 0.12);
    }

    @media (max-width: 640px) {
      #form-justificacion {
        padding-bottom: 136px;
      }

      #form-solicitud {
        padding-bottom: 136px;
      }

      #just-senal {
        width: calc(100vw - 24px);
      }

      #sol-senal {
        width: calc(100vw - 24px);
      }
    }

    .just-file-input {
      border-color: #60a5fa;
      background: #eff6ff;
    }

    .just-file-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgb(37 99 235 / 0.2);
    }
    
    .material-icons {
      vertical-align: middle;
      font-size: 20px;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      ring-color: var(--primary);
    }
    
    #estado-Pendiente {
      background-color: #f59e0b;
      font-weight: bold;
    }
    
    #estado-Autorizada {
      background-color: #10b981;
      font-weight: bold;
    }
    
    #estado-Justificada {
      background-color: #3b82f6;
      font-weight: bold;
    }
    
    #estado-Completada {
      background-color: #6b7280;
      font-weight: bold;
    }
    
    #estado-Injustificada {
      background-color: #8b5cf6;
      font-weight: bold;
    }
    #estado-Descuento {
      background-color: #ef4444;
      font-weight: bold;
    }
  </style>
