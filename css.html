  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sistema de Licencias - CPEM N° 25</title>
  
  <!-- Google Fonts - Manrope -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <style>
    * {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    :root {
      --primary: #2B3E4C;
      --primary-light: #3d5468;
      --primary-dark: #1f2d38;
      --secondary: #10b981;
      --secondary-light: #34d399;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --text-primary: #2B3E4C;
      --text-secondary: #64748b;
      --border-light: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }
    
    body {
      background: var(--bg-light);
      color: var(--text-primary);
    }
    
    .spinner {
      border: 3px solid #f1f5f9;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes slideIn {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .animate-slide-in {
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideOut {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-10px); opacity: 0; }
    }
    
    .animate-slide-out {
      animation: slideOut 0.3s ease-out;
    }
    
    .card {
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
      transition: box-shadow 0.2s ease;
    }
    
    .card:hover {
      box-shadow: var(--shadow-md);
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    
    .btn-primary:hover {
      background: var(--primary-light);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    
    .btn-primary:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }

    .section-toggle {
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.25s ease;
      border: 2px solid transparent;
      box-shadow: var(--shadow-sm);
      color: white;
    }

    .section-toggle .material-icons {
      transition: transform 0.2s ease;
    }

    .section-toggle:hover .material-icons {
      transform: translateY(-1px);
    }

    .section-toggle--solicitud {
      background: var(--primary-light);
    }

    .section-toggle--solicitud:hover {
      background: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .section-toggle--justificacion {
      background: var(--secondary-light);
    }

    .section-toggle--justificacion:hover {
      background: var(--secondary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .section-toggle.is-active {
      box-shadow: var(--shadow-lg);
      transform: translateY(-1px);
    }

    .section-toggle--solicitud.is-active {
      background: var(--primary);
      border-color: var(--primary-dark);
    }

    .section-toggle--justificacion.is-active {
      background: var(--secondary);
      border-color: #059669;
    }

    .section-panel {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .section-panel--solicitud {
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 20%);
      border-top: 4px solid var(--primary-light);
    }

    .section-panel--justificacion {
      background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 22%);
      border-top: 4px solid var(--secondary);
    }

    @keyframes sectionFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sectionFadeOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-6px);
      }
    }

    .section-fade-in {
      animation: sectionFadeIn 0.28s ease forwards;
    }

    .section-fade-out {
      animation: sectionFadeOut 0.2s ease forwards;
    }
    
    .material-icons {
      vertical-align: middle;
      font-size: 20px;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      ring-color: var(--primary);
    }
    
    #estado-Pendiente {
      background-color: #f59e0b;
      font-weight: bold;
    }
    
    #estado-Autorizada {
      background-color: #10b981;
      font-weight: bold;
    }
    
    #estado-Justificada {
      background-color: #3b82f6;
      font-weight: bold;
    }
    
    #estado-Completada {
      background-color: #6b7280;
      font-weight: bold;
    }
    
    #estado-Injustificada {
      background-color: #ef4444;
      font-weight: bold;
    }
  </style>
