<script>
  function obtenerTotalPaginas(totalRegistros) {
    return Math.ceil(totalRegistros / registrosPorPagina);
  }

  function obtenerRangoRegistros(pagina) {
    const inicio = (pagina - 1) * registrosPorPagina;
    const fin = Math.min(inicio + registrosPorPagina, solicitudesData.length);
    return { inicio, fin };
  }

  function obtenerRegistrosPaginados(data, pagina) {
    const inicio = (pagina - 1) * registrosPorPagina;
    const fin = inicio + registrosPorPagina;
    return data.slice(inicio, fin);
  }

  function renderizarSolicitudesPaginadas() {
    const datosAMostrar = filtroActivoSolicitudes ? solicitudesFiltradas : solicitudesData;
    const totalPaginas = obtenerTotalPaginas(datosAMostrar.length);

    if (paginaActualSolicitudes > totalPaginas) {
      paginaActualSolicitudes = Math.max(1, totalPaginas);
    }

    const registrosPagina = obtenerRegistrosPaginados(datosAMostrar, paginaActualSolicitudes);
    const inicio = (paginaActualSolicitudes - 1) * registrosPorPagina;
    const fin = Math.min(inicio + registrosPorPagina, datosAMostrar.length);

    document.getElementById('solicitudes-inicio').textContent = datosAMostrar.length === 0 ? 0 : inicio + 1;
    document.getElementById('solicitudes-fin').textContent = fin;
    document.getElementById('solicitudes-total').textContent = datosAMostrar.length;
    document.getElementById('solicitudes-pagina-actual').textContent = paginaActualSolicitudes;
    document.getElementById('solicitudes-total-paginas').textContent = totalPaginas;

    document.getElementById('btn-anterior-solicitudes').disabled = paginaActualSolicitudes === 1;
    document.getElementById('btn-siguiente-solicitudes').disabled = paginaActualSolicitudes === totalPaginas;

    generarNumerosPagina('solicitudes', paginaActualSolicitudes, totalPaginas);
    renderizarSolicitudes(registrosPagina);
  }

  function paginaAnteriorSolicitudes() {
    if (paginaActualSolicitudes > 1) {
      paginaActualSolicitudes--;
      renderizarSolicitudesPaginadas();
    }
  }

  function paginaSiguienteSolicitudes() {
    const totalPaginas = obtenerTotalPaginas(solicitudesData.length);
    if (paginaActualSolicitudes < totalPaginas) {
      paginaActualSolicitudes++;
      renderizarSolicitudesPaginadas();
    }
  }

  function irAPaginaSolicitudes(pagina) {
    paginaActualSolicitudes = pagina;
    renderizarSolicitudesPaginadas();
  }

  function renderizarJustificacionesPaginadas() {
    const datosAMostrar = filtroActivoJustificaciones ? justificacionesFiltradas : justificacionesData;
    const totalPaginas = obtenerTotalPaginas(datosAMostrar.length);

    if (paginaActualJustificaciones > totalPaginas) {
      paginaActualJustificaciones = Math.max(1, totalPaginas);
    }

    const registrosPagina = obtenerRegistrosPaginados(datosAMostrar, paginaActualJustificaciones);
    const inicio = (paginaActualJustificaciones - 1) * registrosPorPagina;
    const fin = Math.min(inicio + registrosPorPagina, datosAMostrar.length);

    document.getElementById('justificaciones-inicio').textContent = datosAMostrar.length === 0 ? 0 : inicio + 1;
    document.getElementById('justificaciones-fin').textContent = fin;
    document.getElementById('justificaciones-total').textContent = datosAMostrar.length;
    document.getElementById('justificaciones-pagina-actual').textContent = paginaActualJustificaciones;
    document.getElementById('justificaciones-total-paginas').textContent = totalPaginas;

    document.getElementById('btn-anterior-justificaciones').disabled = paginaActualJustificaciones === 1;
    document.getElementById('btn-siguiente-justificaciones').disabled = paginaActualJustificaciones === totalPaginas;

    generarNumerosPagina('justificaciones', paginaActualJustificaciones, totalPaginas);
    renderizarJustificaciones(registrosPagina);
  }

  function paginaAnteriorJustificaciones() {
    if (paginaActualJustificaciones > 1) {
      paginaActualJustificaciones--;
      renderizarJustificacionesPaginadas();
    }
  }

  function paginaSiguienteJustificaciones() {
    const totalPaginas = obtenerTotalPaginas(justificacionesData.length);
    if (paginaActualJustificaciones < totalPaginas) {
      paginaActualJustificaciones++;
      renderizarJustificacionesPaginadas();
    }
  }

  function irAPaginaJustificaciones(pagina) {
    paginaActualJustificaciones = pagina;
    renderizarJustificacionesPaginadas();
  }

  function renderizarDescuentosInjustificadosPaginadas() {
    const datosAMostrar = descuentosInjustificadosData || [];
    const totalPaginas = obtenerTotalPaginas(datosAMostrar.length);

    if (paginaActualDescuentos > totalPaginas) {
      paginaActualDescuentos = Math.max(1, totalPaginas);
    }

    const registrosPagina = obtenerRegistrosPaginados(datosAMostrar, paginaActualDescuentos);
    const inicio = (paginaActualDescuentos - 1) * registrosPorPagina;
    const fin = Math.min(inicio + registrosPorPagina, datosAMostrar.length);

    document.getElementById('descuentos-inicio').textContent = datosAMostrar.length === 0 ? 0 : inicio + 1;
    document.getElementById('descuentos-fin').textContent = fin;
    document.getElementById('descuentos-total').textContent = datosAMostrar.length;
    document.getElementById('descuentos-pagina-actual').textContent = paginaActualDescuentos;
    document.getElementById('descuentos-total-paginas').textContent = totalPaginas;

    document.getElementById('btn-anterior-descuentos').disabled = paginaActualDescuentos === 1;
    document.getElementById('btn-siguiente-descuentos').disabled = paginaActualDescuentos === totalPaginas;

    generarNumerosPagina('descuentos', paginaActualDescuentos, totalPaginas);
    renderizarDescuentosInjustificados(registrosPagina);
  }

  function paginaAnteriorDescuentos() {
    if (paginaActualDescuentos > 1) {
      paginaActualDescuentos--;
      renderizarDescuentosInjustificadosPaginadas();
    }
  }

  function paginaSiguienteDescuentos() {
    const totalPaginas = obtenerTotalPaginas(descuentosInjustificadosData.length);
    if (paginaActualDescuentos < totalPaginas) {
      paginaActualDescuentos++;
      renderizarDescuentosInjustificadosPaginadas();
    }
  }

  function irAPaginaDescuentos(pagina) {
    paginaActualDescuentos = pagina;
    renderizarDescuentosInjustificadosPaginadas();
  }

  function generarNumerosPagina(tipo, paginaActual, totalPaginas) {
    const contenedor = document.getElementById(`numeros-pagina-${tipo}`);
    contenedor.innerHTML = '';

    if (totalPaginas <= 1) return;

    const maxBotones = 7;
    let inicio = Math.max(1, paginaActual - Math.floor(maxBotones / 2));
    let fin = Math.min(totalPaginas, inicio + maxBotones - 1);

    if (fin - inicio + 1 < maxBotones) {
      inicio = Math.max(1, fin - maxBotones + 1);
    }

    for (let i = inicio; i <= fin; i++) {
      const btn = document.createElement('button');
      btn.className = `px-2 py-1 rounded text-sm ${
        i === paginaActual
          ? 'bg-blue-600 text-white'
          : 'border border-gray-300 hover:bg-gray-50'
      }`;
      btn.textContent = i;
      btn.onclick = () => {
        if (tipo === 'solicitudes') return irAPaginaSolicitudes(i);
        if (tipo === 'justificaciones') return irAPaginaJustificaciones(i);
        if (tipo === 'descuentos') return irAPaginaDescuentos(i);
      };
      contenedor.appendChild(btn);
    }
  }

  function cambiarRegistrosPorPagina(valor) {
    registrosPorPagina = parseInt(valor, 10) || 25;

    paginaActualSolicitudes = 1;
    paginaActualJustificaciones = 1;
    paginaActualDescuentos = 1;
    renderizarSolicitudesPaginadas();
    if (!document.getElementById('vista-descuentos').classList.contains('hidden')) {
      renderizarDescuentosInjustificadosPaginadas();
    }
    mostrarToast('info', 'Paginación', `Ahora mostrando ${valor} registros por página`);
  }
</script>
